function changeFeatQty(delta) {
const feat = products[0];
if (!feat) return;
const avail = Math.max(0, feat.stock - feat.reserved);
featuredQty = Math.min(Math.max(1, featuredQty + delta), Math.max(1, avail));
renderAll();
}
function addToCart(id, qty) {
const prod = products.find(p => p.id === id);
if (!prod) return;
const avail = Math.max(0, prod.stock - prod.reserved);
if (avail <= 0) return alert("Produto esgotado!");
const existing = cart.find(c => c.id === id);
if (existing) {
if (existing.qty + qty <= avail) existing.qty += qty;
else return alert("Limite de estoque atingido!");
} else {
cart.push({ id: prod.id, name: prod.name, price: prod.price, img: prod.img, qty: Math.min(qty, avail) });
}
renderAll();
}
function renderCartView() {
const emptyEl = document.getElementById("cart-empty-state");
const filledEl = document.getElementById("cart-filled-state");
if (cart.length === 0) {
emptyEl.style.display = "block";
filledEl.style.display = "none";
return;
}
emptyEl.style.display = "none";
filledEl.style.display = "block";
const itemsEl = document.getElementById("cart-items-container");
itemsEl.innerHTML = cart.map((item, idx) => <div class="cart-item-row"> <div style="display:flex; align-items:center; gap:10px;"> <div style="width:42px; height:42px; background:#0b0809; border-radius:8px; display:flex; align-items:center; justify-content:center; overflow:hidden;"> ${imgTag(item.img, item.name)} </div> <div> <div style="font-size:0.82rem; font-weight:900;">${item.name}</div> <div style="font-size:0.75rem; color:var(--muted);">${money(item.price)} x ${item.qty}</div> </div> </div> <div style="display:flex; align-items:center; gap:10px;"> <span style="font-weight:900; color:var(--red-bright); font-family:monospace;">${money(item.price * item.qty)}</span> <button style="background:transparent; border:none; color:var(--muted); cursor:pointer;" onclick="removeCartItem(${idx})">🗑️</button> </div> </div>).join("");
const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
document.getElementById("cart-total-val").innerText = money(total);
}

}
function finishOrder() {
if (cart.length === 0) return;
const buyer = document.getElementById("buyer-name").value.trim() || "Cliente";
const phone = document.getElementById("buyer-phone").value.trim();
cart.forEach(item => {
const prod = products.find(p => p.id === item.id);
if (prod) prod.reserved += item.qty;
});
const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
const orderId = Math.random().toString(16).substring(2, 10).toUpperCase();
const summaryText = cart.map(i => ${i.qty}x ${i.name}).join(", ");
orders.unshift({
id: orderId,
buyer,
items: summaryText,
rawItems: JSON.parse(JSON.stringify(cart)),
total,
status: "RESERVADO",
created: new Date().toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })
});
let msg = *PEDIDO #${orderId} - PSYCHOSTORE*\n\n;
msg += *Cliente/Nick:* ${buyer}\n;
if (phone) msg += *Telefone:* ${phone}\n;
msg += *Itens:* ${summaryText}\n;
msg += *Total:* ${money(total)}\n\n;
msg += Unidades reservadas! Aguardo a chave Pix para pagar.;
cart = [];
persist();
switchView("store");
window.open(https://wa.me{whatsappNum}?text=${encodeURIComponent(msg)}, "_blank");
}
function renderAdminView() {
document.getElementById("admin-wpp-input").value = whatsappNum;
const tbody = document.getElementById("admin-products-tbody");
tbody.innerHTML = products.map(p => {
const avail = Math.max(0, p.stock - p.reserved);
return `
${avail}`;
}).join("");
const oTbody = document.getElementById("admin-orders-tbody");
oTbody.innerHTML = orders.map((o, idx) => {
let stClass = "st-pendente";

if (o.status === "CANCELADO") stClass = "st-cancelado";
return `
${o.id}
\({o.items}<br><small style="color:var(--muted);">\){o.buyer}${money(o.total)}${o.status}${o.created}${o.status === "RESERVADO" ? `
:-`}
`;
}).join("");
}
function saveRow(id) {
const p = products.find(x => x.id === id);
if (!p) return;
const newP = parseFloat(document.getElementById("inp-price-" + id).value);
const newS = parseInt(document.getElementById("inp-stock-" + id).value);
if (!isNaN(newP)) p.price = newP;
if (!isNaN(newS)) p.stock = Math.max(0, newS);
persist();
alert("Alterações salvas!");
}
function confirmPaid(idx) {
const o = orders[idx];
if (!o || o.status !== "RESERVADO") return;
o.rawItems.forEach(item => {
const prod = products.find(p => p.id === item.id);
if (prod) {
prod.reserved = Math.max(0, prod.reserved - item.qty);
prod.stock = Math.max(0, prod.stock - item.qty);
}
});
o.status = "PAGO";
persist();
}
function cancelOrder(idx) {
const o = orders[idx];
if (!o || o.status !== "RESERVADO") return;
o.rawItems.forEach(item => {
const prod = products.find(p => p.id === item.id);
if (prod) {
prod.reserved = Math.max(0, prod.reserved - item.qty);
}
});
o.status = "CANCELADO";
persist();
}
function saveWhatsapp() {
const val = document.getElementById("admin-wpp-input").value.replace(/\D/g, "");
if (val) {
whatsappNum = val;
persist();
alert("WhatsApp salvo!");
}
}
function openProductModal(id = null) {
document.getElementById("prod-modal").classList.add("open");
if (id) {
const p = products.find(x => x.id === id);
document.getElementById("modal-prod-title").innerText = "EDITAR PRODUTO";
document.getElementById("edit-prod-id").value = p.id;
document.getElementById("modal-prod-name").value = p.name;
document.getElementById("modal-prod-desc").value = p.desc || "";
document.getElementById("modal-prod-price").value = p.price;
document.getElementById("modal-prod-stock").value = p.stock;
document.getElementById("modal-prod-img").value = p.img || "";
} else {
document.getElementById("modal-prod-title").innerText = "NOVO PRODUTO";
document.getElementById("edit-prod-id").value = "";
document.getElementById("modal-prod-name").value = "";
document.getElementById("modal-prod-desc").value = "";
document.getElementById("modal-prod-price").value = "";
document.getElementById("modal-prod-stock").value = "1";
document.getElementById("modal-prod-img").value = "";
}
}
function closeProductModal() {
document.getElementById("prod-modal").classList.remove("open");
}
function saveProductModal() {
const id = document.getElementById("edit-prod-id").value;
const name = document.getElementById("modal-prod-name").value.trim().toUpperCase();
const desc = document.getElementById("modal-prod-desc").value.trim();
const price = parseFloat(document.getElementById("modal-prod-price").value) || 0;
const stock = parseInt(document.getElementById("modal-prod-stock").value) || 0;
const img = document.getElementById("modal-prod-img").value.trim();
if (!name) return alert("Digite o nome do produto!");
if (id) {
const p = products.find(x => x.id == id);
if (p) {
p.name = name;
p.desc = desc;
p.price = price;
p.stock = stock;
p.img = img;
}
} else {
products.push({ id: Date.now(), name, desc, price, stock, reserved: 0, img });
}
closeProductModal();
persist();
}
function deleteItem(id) {
if (!confirm("Excluir este item?")) return;
products = products.filter(p => p.id !== id);
persist();
}
