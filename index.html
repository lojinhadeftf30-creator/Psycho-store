<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Nome e SEO para aparecer no Google -->
  <title>🪚psycho | store🪓</title>
  <meta name="description" content="Loja oficial 🪚psycho | store🪓 — Estoque automático, entrega rápida e atendimento direto." />
  <meta property="og:site_name" content="🪚psycho | store🪓" />
  <meta property="og:title" content="🪚psycho | store🪓" />
  <meta property="og:description" content="Confira nossos itens com estoque automático e entrega rápida." />
  <meta property="og:type" content="website" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "🪚psycho | store🪓",
      "url": "https://netlify.app"
    }
  </script>

  <style>
    :root {
      --bg: #0b0b0f;
      --card: #15151d;
      --card-hover: #1d1d28;
      --border: #2a2a38;
      --primary: #e11d48;
      --primary-hover: #be123c;
      --text: #f4f4f6;
      --muted: #9ca3af;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }

    /* Header */
    header {
      background: rgba(21, 21, 29, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 1.35rem; font-weight: 800; letter-spacing: 0.5px; color: #fff; }
    .header-actions { display: flex; gap: 10px; align-items: center; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; padding: 10px 16px; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 14px; }
    .btn-outline:hover { background: var(--card-hover); }
    .btn-success { background: var(--success); color: #052e16; padding: 12px 18px; width: 100%; font-size: 1rem; }

    /* Banner */
    .hero {
      max-width: 1100px;
      margin: 24px auto 16px;
      padding: 24px 20px;
      background: linear-gradient(135deg, #1f1118 0%, #15151d 100%);
      border: 1px solid #3f1d2b;
      border-radius: 14px;
      text-align: center;
    }
    .hero h1 { font-size: 1.8rem; margin-bottom: 8px; }
    .hero p { color: var(--muted); font-size: 0.95rem; }
    .badge-promo {
      display: inline-block;
      margin-top: 12px;
      background: rgba(225, 29, 72, 0.15);
      color: #fb7185;
      border: 1px solid rgba(225, 29, 72, 0.4);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Container & Filters */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    .filters { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 20px; }
    .filter-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Grid de Produtos */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-3px); border-color: #4b4b63; }
    .card-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #1e1e2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-cat { font-size: 0.75rem; text-transform: uppercase; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
    .card-desc { font-size: 0.85rem; color: var(--muted); margin-bottom: 14px; line-height: 1.4; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; }
    .price { font-size: 1.2rem; font-weight: 800; color: #fff; }
    .stock { font-size: 0.8rem; color: var(--success); font-weight: 600; }
    .stock.out { color: var(--primary); }

    /* Modais */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .close-btn { background: transparent; color: var(--muted); font-size: 1.4rem; }

    /* Formulários */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }
    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .pix-box {
      background: var(--bg);
      border: 1px dashed var(--primary);
      padding: 12px;
      border-radius: 8px;
      margin: 12px 0;
      text-align: center;
    }
    .admin-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🪚psycho | store🪓</div>
    <div class="header-actions">
      <button class="btn-outline" onclick="openAdminModal()">⚙️ Dono</button>
      <button class="btn-primary" onclick="openCartModal()">🛒 Carrinho (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <section class="container">
    <div class="hero">
      <h1>🪚psycho | store🪓</h1>
      <p>Estoque automático, preços baixos e entrega rápida via WhatsApp.</p>
      <div class="badge-promo">🔥 Clientes recorrentes ganham 10% de desconto (Cupom: VOLTEI10)</div>
    </div>

    <div class="filters" id="category-filters"></div>
    <div class="grid" id="product-grid"></div>
  </section>

  <!-- Modal Carrinho / Checkout -->
  <div class="modal-backdrop" id="cart-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>🛒 Seu Carrinho</h3>
        <button class="close-btn" onclick="closeModals()">✕</button>
      </div>
      <div id="cart-items"></div>

      <div class="form-group" style="margin-top: 14px;">
        <label>Seu Nick / Nome no jogo</label>
        <input type="text" id="customer-name" placeholder="Ex: Player123" />
      </div>

      <div class="form-group">
        <label>Cupom de Desconto (opcional)</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="coupon-input" placeholder="Ex: VOLTEI10" />
          <button class="btn-outline" onclick="applyCoupon()">Aplicar</button>
        </div>
      </div>

      <div class="pix-box">
        <div style="font-size: 0.85rem; color: var(--muted);">Chave Pix para pagamento:</div>
        <strong id="display-pix-key" style="color: #fff; font-size: 1rem; word-break: break-all;">Configure no Painel do Dono</strong>
        <div style="margin-top: 8px;">
          <button class="btn-outline" style="font-size: 0.8rem; padding: 5px 10px;" onclick="copyPix()">Copiar Chave Pix</button>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 800; margin: 14px 0;">
        <span>Total:</span>
        <span id="cart-total">R$ 0,00</span>
      </div>

      <button class="btn-success" onclick="checkoutWhatsApp()">Finalizar e Enviar no WhatsApp</button>
    </div>
  </div>

  <!-- Modal Painel do Dono -->
  <div class="modal-backdrop" id="admin-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>⚙️ Painel Administrativo</h3>
        <button class="close-btn" onclick="closeModals()">✕</button>
      </div>

      <!-- Tela de Login do Dono -->
      <div id="admin-login-view">
        <div class="form-group">
          <label>Nome da Conta do Dono</label>
          <input type="text" id="admin-account-input" placeholder="Digite o nome da conta" />
        </div>
        <div class="form-group">
          <label>Senha do Dono</label>
          <input type="password" id="admin-pass-input" placeholder="Digite sua senha" />
        </div>
        <button class="btn-primary" style="width: 100%;" onclick="loginAdmin()">Entrar no Painel</button>
      </div>

      <!-- Tela Logada do Dono -->
      <div id="admin-panel-view" style="display: none;">
