  <style>
    :root {
      --bg: #060608;
      --bg-card: #121218;
      --border: #2c141a;
      --primary: #ef4444;
      --primary-dark: #991b1b;
      --neon: rgba(239, 68, 68, 0.55);
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 15%, rgba(239, 68, 68, 0.14), transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(185, 28, 28, 0.12), transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 110px;
      overflow-x: hidden;
    }

    @keyframes floatHammer {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-7px) rotate(3deg); }
    }
    @keyframes pulseBorder {
      0%, 100% { border-color: rgba(239, 68, 68, 0.45); box-shadow: 0 0 15px rgba(239, 68, 68, 0.25); }
      50% { border-color: rgba(239, 68, 68, 0.95); box-shadow: 0 0 28px rgba(239, 68, 68, 0.5); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    header {
      background: rgba(8, 8, 12, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-size: 1.28rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 14px var(--neon);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 10px 16px;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 20px var(--neon); }
    .btn-outline {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
    }
    .btn-outline:hover { border-color: var(--primary); background: rgba(239, 68, 68, 0.12); }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #047857);
      color: #fff;
      padding: 14px 18px;
      width: 100%;
      font-size: 1rem;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
    }

    .container { max-width: 1140px; margin: 0 auto; padding: 0 16px; }

    /* Banner */
    .hero {
      margin: 20px 0 24px;
      padding: 34px 20px;
      background: linear-gradient(135deg, rgba(22, 6, 10, 0.92) 0%, rgba(10, 10, 15, 0.88) 100%);
      border: 1px solid rgba(239, 68, 68, 0.65);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      animation: pulseBorder 4s infinite;

      flex-direction: column;

    .hero-badge {

      color: #fca5a5;
      padding: 5px 14px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .hero h1 { font-size: 2rem; font-weight: 900; margin-bottom: 8px; }
    .hero h1 span { color: var(--primary); text-shadow: 0 0 16px var(--neon); }
    .hero p { color: #e2e8f0; font-size: 0.95rem; max-width: 580px; margin-bottom: 16px; }
    .hero-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .stat-chip {

      padding: 7px 13px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    /* Pesquisa e Filtros */
    .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .search-wrap { position: relative; }
    .search-wrap input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 13px 16px 13px 42px;
      border-radius: 12px;
      font-size: 0.95rem;
    }
    .search-wrap input:focus { outline: none; border-color: var(--primary); }
    .search-wrap span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }

    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      background: var(--bg-card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 9px 16px;
      border-radius: 99px;
      white-space: nowrap;
      font-size: 0.88rem;
    }
    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.45);
    }

    /* Grid de Produtos */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 16px;
      animation: fadeIn 0.35s ease;
    }
    .card {
      background: rgba(18, 18, 24, 0.94);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.25s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.25);
    }
    .card-top-tags {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 2;
      pointer-events: none;
    }
    .rarity-badge {
      background: rgba(8, 8, 12, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .r-lendario { color: #fbbf24; border-color: rgba(251, 191, 36, 0.5); }
    .r-mitico { color: #f87171; border-color: rgba(248, 113, 113, 0.5); }
    .r-evento { color: #c084fc; border-color: rgba(192, 132, 252, 0.5); }
    .r-raro { color: #60a5fa; border-color: rgba(96, 165, 250, 0.5); }

    .promo-badge {
      background: var(--primary);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 900;
    }

    /* Foto do Produto */
    .card-visual {
      width: 100%;
      height: 185px;
      background: radial-gradient(circle at center, #291017 0%, #09090d 85%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .card-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .card:hover .card-visual img { transform: scale(1.06); }

    .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-cat { font-size: 0.72rem; color: var(--primary); font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
    .card-title { font-size: 1.08rem; font-weight: 800; margin-bottom: 10px; color: #fff; }

    /* Contador de Estoque Estilo 3/5 */
    .stock-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .stock-ok {
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .stock-zero {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .old-price { font-size: 0.82rem; color: var(--muted); text-decoration: line-through; display: block; }
    .price { font-size: 1.24rem; font-weight: 900; color: #fff; }

    .section-title {
